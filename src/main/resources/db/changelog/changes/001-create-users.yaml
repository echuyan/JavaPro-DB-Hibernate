databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: echuyan
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: users

      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true