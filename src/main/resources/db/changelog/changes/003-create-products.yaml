databaseChangeLog:
  - changeSet:
      id: 003-create-products
      author: echuyan
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: products

      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: balance
                  type: NUMERIC(20,2)
                  constraints:
                    nullable: false
              - column:
                  name: product_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_products_users

        - createIndex:
            tableName: products
            indexName: idx_products_user_id
            columns:
              - column:
                  name: user_id